<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EnCo Vendor Registration</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface-2: #fafbfc;
    --line: #e6e8ec;
    --line-2: #eef0f3;
    --text: #1a1d23;
    --text-2: #4a525e;
    --text-3: #8a93a0;
    --primary: oklch(45% 0.13 250);
    --primary-soft: oklch(95% 0.03 250);
    --primary-border: oklch(85% 0.06 250);
    --primary-ink: oklch(35% 0.13 250);
    --accent: oklch(85% 0.13 90);
    --accent-soft: oklch(96% 0.05 90);
    --success: oklch(55% 0.13 155);
    --success-soft: oklch(94% 0.04 155);
    --warn: oklch(68% 0.15 70);
    --warn-soft: oklch(95% 0.05 70);
    --danger: oklch(58% 0.18 25);
    --danger-soft: oklch(95% 0.04 25);
    --radius: 10px;
    --radius-sm: 6px;
    --radius-lg: 16px;
    --shadow-sm: 0 1px 2px rgba(15,20,30,.04), 0 0 0 1px rgba(15,20,30,.04);
    --shadow: 0 4px 16px -4px rgba(15,20,30,.08), 0 0 0 1px rgba(15,20,30,.04);
    --shadow-lg: 0 18px 40px -12px rgba(15,20,30,.18), 0 0 0 1px rgba(15,20,30,.05);
    --row-h: 44px;
    --pad: 16px;
    --font-th: "IBM Plex Sans Thai", "Inter", system-ui, sans-serif;
    --font-en: "Inter", "IBM Plex Sans Thai", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
  }
  [data-density="compact"] { --row-h: 36px; --pad: 12px; }
  [data-density="comfy"]   { --row-h: 52px; --pad: 22px; }

  [data-dark="true"] {
    --bg: #0d1117;
    --surface: #161b22;
    --surface-2: #1c222b;
    --line: #2a313b;
    --line-2: #232a33;
    --text: #e6edf3;
    --text-2: #adb7c2;
    --text-3: #6e7681;
    --primary-soft: oklch(28% 0.07 250);
    --primary-border: oklch(40% 0.09 250);
    --primary-ink: oklch(85% 0.10 250);
    --accent-soft: oklch(35% 0.08 90);
    --success-soft: oklch(28% 0.06 155);
    --warn-soft: oklch(32% 0.08 70);
    --danger-soft: oklch(30% 0.08 25);
    --shadow-sm: 0 1px 2px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.04);
    --shadow: 0 4px 16px -4px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.04);
    --shadow-lg: 0 18px 40px -12px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.05);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: var(--font-th); font-size: 14px; line-height: 1.55;
    -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }
  input, textarea, select { font: inherit; color: inherit; }

  .mono { font-family: var(--font-mono); font-feature-settings: "tnum"; }
  .num { font-variant-numeric: tabular-nums; }

  /* shared */
  .card { background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px;
    border-radius: 999px; font-size: 12px; font-weight: 500; line-height: 1.5; }
  .pill-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 40px; padding: 0 16px; border-radius: var(--radius); border: 1px solid transparent;
    font-weight: 500; cursor: pointer; transition: all .15s; white-space: nowrap;
    font-size: 14px; }
  .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-ghost { background: transparent; color: var(--text); border-color: var(--line); }
  .btn-ghost:hover { background: var(--surface-2); }
  .btn-soft { background: var(--primary-soft); color: var(--primary-ink); border-color: transparent; }
  .btn-soft:hover { filter: brightness(.97); }
  .btn-sm { height: 32px; padding: 0 12px; font-size: 13px; border-radius: 8px; }
  .btn-icon { width: 36px; padding: 0; }

  /* inputs */
  .input, .select, .textarea {
    width: 100%; height: var(--row-h); background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 0 12px;
    transition: border .15s, box-shadow .15s; font-size: 14px;
  }
  .textarea { height: auto; padding: 10px 12px; resize: vertical; min-height: 80px; }
  .input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-soft); }
  .input::placeholder, .textarea::placeholder { color: var(--text-3); }

  .label { font-size: 13px; font-weight: 500; color: var(--text-2);
    display: flex; align-items: center; gap: 4px; }
  .label .req { color: var(--danger); }
  .help { font-size: 12px; color: var(--text-3); }

  /* layout */
  .app-shell { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
  .sidebar { background: var(--surface); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 4px; padding: 18px 14px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .main { padding: 28px clamp(20px, 4vw, 48px) 80px;
    max-width: 1480px; width: 100%; margin: 0 auto; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-3); border: 2px solid transparent; background-clip: content-box; }

  /* status chips */
  .chip-status { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px;
    border-radius: 999px; font-size: 12px; font-weight: 500; }
  .chip-status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .st-new    { background: var(--primary-soft); color: var(--primary-ink); }
  .st-review { background: var(--warn-soft); color: oklch(45% 0.12 70); }
  .st-approved { background: var(--success-soft); color: oklch(38% 0.11 155); }
  .st-rejected { background: var(--danger-soft); color: oklch(42% 0.14 25); }
  .st-draft  { background: var(--line); color: var(--text-2); }
  [data-dark="true"] .st-review { color: oklch(80% 0.12 70); }
  [data-dark="true"] .st-approved { color: oklch(78% 0.11 155); }
  [data-dark="true"] .st-rejected { color: oklch(80% 0.14 25); }

  /* tables */
  table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .tbl thead th { text-align: left; font-weight: 500; color: var(--text-3);
    padding: 12px 14px; border-bottom: 1px solid var(--line); background: var(--surface-2);
    font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .tbl tbody td { padding: 14px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
  .tbl tbody tr:last-child td { border-bottom: none; }
  .tbl tbody tr:hover { background: var(--surface-2); }

  /* hero stripe pattern */
  .stripe-bg {
    background-image: repeating-linear-gradient(135deg,
      transparent 0 12px, rgba(255,255,255,.06) 12px 13px);
  }

  /* placeholder image block */
  .ph {
    background-color: var(--surface-2);
    background-image:
      repeating-linear-gradient(135deg,
        transparent 0 9px, rgba(0,0,0,.04) 9px 10px);
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    display: flex; align-items: center; justify-content: center;
    color: var(--text-3); font-family: var(--font-mono); font-size: 11px;
    letter-spacing: .03em;
  }

  /* focus visible */
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 6px; }

  /* utility */
  .row { display: flex; align-items: center; gap: 12px; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .grow { flex: 1; }
  .divider { height: 1px; background: var(--line); }

  /* fade in */
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .fade-in { animation: fadeIn .25s ease; }

  /* responsive */
  .hamburger-btn { display: none; }

  @media (max-width: 1024px) {
    .app-shell { grid-template-columns: 200px 1fr; }
    .main { padding: 20px 16px 60px; }
    .sidebar { padding: 14px 10px; }
    table.tbl { font-size: 12.5px; }
  }

  @media (max-width: 768px) {
    .app-shell { grid-template-columns: 1fr; }
    .sidebar {
      position: fixed; top: 0; left: -200px; width: 200px; height: 100vh;
      border-right: 1px solid var(--line); border-bottom: none; z-index: 999;
      transition: left .3s ease; background: var(--surface);
    }
    .sidebar.open { left: 0; box-shadow: 2px 0 12px rgba(0,0,0,0.15); }
    .main { padding: 16px 12px 60px; }
    html, body { font-size: 13px; }
    .hamburger-btn { display: flex !important; }
    .btn { height: 36px; padding: 0 12px; font-size: 13px; }
    .btn-sm { height: 28px; padding: 0 8px; font-size: 12px; }
    .btn-icon { width: 32px; }
    table.tbl { font-size: 12px; }
    .tbl tbody td { padding: 10px; }
    .label { font-size: 12px; }
    .help { font-size: 11px; }
  }

  @media (max-width: 480px) {
    .main { padding: 12px 8px 50px; }
    html, body { font-size: 12px; }
    .btn { height: 32px; padding: 0 10px; font-size: 12px; gap: 6px; }
    .btn-sm { height: 26px; padding: 0 6px; font-size: 11px; }
    .input, .select, .textarea { font-size: 13px; }
    .textarea { min-height: 60px; }
    .row { gap: 8px; }
    .col { gap: 8px; }
    table.tbl { font-size: 11px; }
    .tbl thead th { padding: 8px 10px; font-size: 10px; }
    .tbl tbody td { padding: 8px; }
    .pill { padding: 2px 6px; font-size: 11px; }
    .label { font-size: 11px; }
  }
</style>
</head>
