<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Generate Excel Docs — EnCo</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex;

    min-height: 100vh; margin: 0; gap: 20px; }
  .card { background: white; border-radius: 12px; padding: 32px; box-shadow: 0 2px 12px rgba(0,0,0,.1);
    max-width: 520px; width: 90%; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 8px; color: #1a1d23; }
  p { color: #6b7280; font-size: 14px; margin: 0 0 24px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px;
    border-radius: 8px; border: none; cursor: pointer; font-size: 15px; font-weight: 600;
    transition: all .15s; margin: 6px; }
  .btn-blue { background: #2563eb; color: white; }
  .btn-blue:hover { background: #1d4ed8; }
  .btn-green { background: #16a34a; color: white; }
  .btn-green:hover { background: #15803d; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .status { margin-top: 16px; font-size: 13px; color: #6b7280; min-height: 20px; }
  .success { color: #16a34a; font-weight: 600; }
  .error { color: #dc2626; font-weight: 600; }
  .loading { color: #6b7280; }
  #loadingMsg { color: #f59e0b; font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
<div class="card">
  <h1>📊 สร้างไฟล์ Excel</h1>
  <p>คลิกปุ่มด้านล่างเพื่อ Download ไฟล์ Excel</p>
  <div>
    <button class="btn btn-blue" id="btnDic" onclick="generateDataDic()">
      📖 Download Data Dictionary
    </button>
    <br>
    <button class="btn btn-green" id="btnTest" onclick="generateTestData()">
      🧪 Download Test Data
    </button>
  </div>
  <div class="status" id="status"></div>
  <div id="loadingMsg">⏳ กำลังโหลด XLSX library...</div>
</div>

<script>
// โหลด XLSX จาก unpkg (ฟรี ไม่มีลิขสิทธิ์)
(function loadXLSX() {
  var script = document.createElement('script');
  script.src = 'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js';
  script.onload = function() {
    document.getElementById('loadingMsg').textContent = '✅ พร้อมใช้งาน';
    document.getElementById('loadingMsg').style.color = '#16a34a';
    document.getElementById('btnDic').disabled = false;
    document.getElementById('btnTest').disabled = false;
    setTimeout(function(){ document.getElementById('loadingMsg').textContent = ''; }, 2000);
  };
  script.onerror = function() {
    // ลอง CDN สำรอง
    var script2 = document.createElement('script');
    script2.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    script2.onload = function() {
      document.getElementById('loadingMsg').textContent = '✅ พร้อมใช้งาน';
      document.getElementById('loadingMsg').style.color = '#16a34a';
      document.getElementById('btnDic').disabled = false;
      document.getElementById('btnTest').disabled = false;
      setTimeout(function(){ document.getElementById('loadingMsg').textContent = ''; }, 2000);
    };
    script2.onerror = function() {
      document.getElementById('loadingMsg').textContent = '❌ โหลดไม่ได้ — กรุณาเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่';
      document.getElementById('loadingMsg').style.color = '#dc2626';
    };
    document.head.appendChild(script2);
  };
  document.getElementById('btnDic').disabled = true;
  document.getElementById('btnTest').disabled = true;
  document.head.appendChild(script);
})();

var setStatus = function(msg, cls) {
  var el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + (cls || '');
};
